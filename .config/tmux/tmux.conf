# tmux config

# better prefix
unbind C-b
set -g prefix §
bind § send-prefix

# 1-based indexing
set -g base-index 1
set -g pane-base-index 1

# true color support
set -g default-terminal "tmux-256color"
set -sg terminal-overrides ",*:RGB"

# status bar
set -g status-style bg=default,fg=white
set -g status-left ""
set -g status-right "#[fg=white]#S"

# window buttons
set -g window-status-format " #[fg=magenta]#I #[fg=white]#W "
set -g window-status-current-format " #I #W "

set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=black,bg=magenta}"
set -g window-status-bell-style "fg=red"

# options
set -g renumber-windows on

# qol
set -g escape-time 0
set -g mouse on
setw -g mode-keys vi
set -g history-limit 10000

# keybindings
bind - split-window -v
bind = split-window -h
bind f resize-pane -Z
bind r source-file ~/.config/tmux/tmux.conf
